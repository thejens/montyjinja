[package]
name = "montyjinja"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Write MiniJinja template filters, tests, globals and inline blocks in Python, sandboxed in-process by Pydantic's Monty interpreter"
readme = "README.md"
homepage = "https://github.com/thejens/montyjinja"
repository = "https://github.com/thejens/montyjinja"
keywords = ["minijinja", "jinja", "python", "templates", "sandbox"]
categories = ["template-engine"]
publish = false

[dependencies]
minijinja = { version = "3.0.5", features = ["preserve_order"] }
monty = "1.4.0"
monty-types = "1.4.0"
# Snapshots of initialised modules; Monty serializes its own state with it too.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

[profile.release]
debug = false
